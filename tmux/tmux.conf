# ==============================================================================
# tmux configuration (~/.config/tmux/tmux.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. General & Terminal Settings
# ------------------------------------------------------------------------------
# True color & terminal overrides
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 3000ms
set -g display-time 3000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Focus events enabled for terminals that support them (vital for vim/nvim)
set -g focus-events on

# Enable mouse support (scrolling, selecting panes, resizing)
set -g mouse on

# ------------------------------------------------------------------------------
# 2. Window & Pane Numbering
# ------------------------------------------------------------------------------
# Start window and pane numbering at 1 (0 is too far on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ------------------------------------------------------------------------------
# 3. Keybindings
# ------------------------------------------------------------------------------
# Set prefix key 
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config file easily
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Split panes using | and - (and keep current directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Open new windows in current working directory
bind c new-window -c "#{pane_current_path}"

# Switch panes using Alt-hjkl without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane zoom (prefix + m or default z)
bind m resize-pane -Z

# Toggle status bar visibility (prefix + b or prefix + S)
bind b set -g status
bind S set -g status

# ------------------------------------------------------------------------------
# 4. Vi Copy Mode & Clipboard
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ------------------------------------------------------------------------------
# 5. Status Bar & UI Styling (Tokyo Night – Black)
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#000000,fg=#c0caf5"

# Status left: session name
set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#000000,bold] #S #[bg=default,fg=default] "

# Status right: date and time
set -g status-right-length 50
set -g status-right "#[bg=#1a1b26,fg=#c0caf5] %Y-%m-%d │ %H:%M #[bg=#9ece6a,fg=#000000,bold] #h "

# Window status
setw -g window-status-separator ""
setw -g window-status-format "#[bg=#000000,fg=#565f89]  #I:#W  "
setw -g window-status-current-format "#[bg=#1a1b26,fg=#7dcfff,bold]  #I:#W* "

# Pane borders
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#7aa2f7"
