# ==============================================================================
# tmux configuration (~/.config/tmux/tmux.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. General & Terminal Settings
# ------------------------------------------------------------------------------
# True color & terminal overrides
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 3000ms
set -g display-time 3000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Focus events enabled for terminals that support them (vital for vim/nvim)
set -g focus-events on

# Enable mouse support (scrolling, selecting panes, resizing)
set -g mouse on

# ------------------------------------------------------------------------------
# 2. Window & Pane Numbering
# ------------------------------------------------------------------------------
# Start window and pane numbering at 1 (0 is too far on keyboard)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ------------------------------------------------------------------------------
# 3. Keybindings
# ------------------------------------------------------------------------------
# Set prefix key (Default: C-b; uncomment below if you prefer C-a)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload config file easily
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Split panes using | and - (and keep current directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Open new windows in current working directory
bind c new-window -c "#{pane_current_path}"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Smart pane switching with awareness of Vim splits (Ctrl + h/j/k/l)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

# Switch panes using Vim navigation keys with prefix (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane zoom (prefix + m or default z)
bind m resize-pane -Z

# ------------------------------------------------------------------------------
# 4. Vi Copy Mode & Clipboard
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# ------------------------------------------------------------------------------
# 5. Status Bar & UI Styling
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Status left: session name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=default,fg=default] "

# Status right: date and time
set -g status-right-length 50
set -g status-right "#[bg=#313244,fg=#cdd6f4] %Y-%m-%d │ %H:%M #[bg=#a6e3a1,fg=#11111b,bold] #h "

# Window status
setw -g window-status-separator ""
setw -g window-status-format "#[bg=#1e1e2e,fg=#6c7086]  #I:#W  "
setw -g window-status-current-format "#[bg=#45475a,fg=#ffffff,bold]  #I:#W* "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
