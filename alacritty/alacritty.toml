[general]
live_config_reload = true

# =============================================================================
# Window
# =============================================================================
[window]
decorations = "None"
startup_mode = "Fullscreen"
padding = { x = 8, y = 8 }

# =============================================================================
# Font
# =============================================================================
[font]
size = 13.0

normal      = { family = "JetBrains Mono", style = "Regular" }
bold        = { family = "JetBrains Mono", style = "Bold" }
italic      = { family = "JetBrains Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono", style = "Bold Italic" }

# =============================================================================
# Mouse
# =============================================================================
[mouse]
hide_when_typing = true

# =============================================================================
# Colors — Tokyo Night
# =============================================================================
[colors.primary]
background = "#000000"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[[colors.indexed_colors]]
index = 16
color = "#ff9e64"

[[colors.indexed_colors]]
index = 17
color = "#db4b4b"
